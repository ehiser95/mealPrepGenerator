<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Prep Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };
</script>
<style type="text/tailwindcss">
  @layer components {
    .btn-primary {
      @apply bg-gradient-to-br from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500
             active:scale-95 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-all
             shadow-md shadow-indigo-500/25 hover:shadow-lg hover:shadow-indigo-500/30 hover:-translate-y-0.5;
    }
    .btn-secondary {
      @apply bg-white hover:bg-slate-50 active:scale-95 text-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl
             border border-slate-200 shadow-sm hover:shadow transition-all
             dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200 dark:border-slate-600;
    }
    .btn-chip {
      @apply bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700
             text-xs font-semibold px-3 py-1.5 rounded-full transition-all shadow-sm
             dark:bg-slate-800 dark:border-slate-600 dark:hover:bg-indigo-950/40 dark:hover:border-indigo-500 dark:hover:text-indigo-300;
    }
    .icon-btn {
      @apply w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 active:scale-90 transition text-base
             dark:hover:bg-slate-700;
    }
    .badge {
      @apply inline-block bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full mt-1
             dark:bg-slate-700 dark:text-slate-300;
    }
    .macro-tile {
      @apply rounded-xl py-2.5 shadow-sm ring-1 ring-black/[0.03] dark:ring-white/[0.04] transition-transform;
    }
    .panel {
      @apply bg-white/95 dark:bg-slate-800/90 backdrop-blur-sm rounded-2xl border border-slate-200/80 dark:border-slate-700/80
             shadow-sm;
    }
    .tile-hover {
      @apply hover:-translate-y-1 hover:shadow-lg hover:border-indigo-300 dark:hover:border-indigo-500 transition-all duration-200;
    }
    .page-title {
      @apply text-2xl font-extrabold tracking-tight
             bg-gradient-to-r from-slate-800 to-slate-600 dark:from-slate-100 dark:to-slate-300 bg-clip-text text-transparent;
    }
    .field-label {
      @apply flex flex-col gap-1 text-xs font-semibold text-slate-500
             dark:text-slate-400;
    }
    .field-input {
      @apply bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-800 font-normal
             transition-shadow focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400
             dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100 dark:placeholder-slate-500;
    }
    .empty-state {
      @apply text-center py-16 bg-white rounded-2xl border-2 border-dashed border-slate-300
             dark:bg-slate-800 dark:border-slate-600;
    }
    .nav-btn {
      @apply text-sm font-semibold px-3 py-1.5 rounded-full text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition
             dark:text-slate-400 dark:hover:text-slate-100 dark:hover:bg-slate-700;
    }
    .nav-btn-active {
      @apply bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-500/25
             hover:from-indigo-600 hover:to-violet-600 hover:text-white;
    }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-anim { animation: cardIn 0.25s ease-out; }

  @keyframes flashBg {
    0% { background-color: rgb(224 231 255); }
    100% { background-color: transparent; }
  }
  .autofill-flash { animation: flashBg 0.7s ease-out; border-radius: 0.5rem; }

  .scale-panel { animation: cardIn 0.2s ease-out; }

  .toast-enter { opacity: 0; transform: translateX(20px); transition: opacity 0.25s ease, transform 0.25s ease; }
  .toast-enter-active { opacity: 1; transform: translateX(0); }
  .toast-exit { opacity: 0; transform: translateX(20px); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* Fallback theming for form controls that don't carry explicit bg/text
     utility classes (e.g. ingredient/step rows) so nothing stays white-on-
     white in dark mode. Explicit Tailwind classes elsewhere (.field-input,
     etc.) still win since a class selector outranks these element selectors. */
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }
  input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
  select,
  textarea {
    background-color: #fff;
    border-color: #cbd5e1;
    color: #1e293b;
  }
  html.dark input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
  html.dark select,
  html.dark textarea {
    background-color: #0f172a;
    border-color: #475569;
    color: #f1f5f9;
  }

  /* Modal open/close animation for the recipe-plan detail view */
  @keyframes modalBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPanelIn { from { opacity: 0; transform: scale(0.94) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-backdrop { animation: modalBackdropIn 0.2s ease-out; }
  .modal-panel { animation: modalPanelIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

  body {
    background-image: radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.08), transparent 45%),
                       radial-gradient(circle at 85% 15%, rgba(20, 184, 166, 0.07), transparent 40%);
    background-attachment: fixed;
  }
  html.dark body {
    background-image: radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.14), transparent 45%),
                       radial-gradient(circle at 85% 15%, rgba(20, 184, 166, 0.10), transparent 40%);
  }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors">

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]"></div>

  <header class="bg-white/85 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-700/80 sticky top-0 z-40 transition-colors shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-extrabold flex items-center gap-2 whitespace-nowrap">
        <span class="text-2xl">🥗</span>
        <span class="bg-gradient-to-r from-indigo-600 to-teal-500 dark:from-indigo-400 dark:to-teal-300 bg-clip-text text-transparent">Meal Prep Generator</span>
      </h1>
      <div class="flex flex-wrap items-center gap-2">
        <nav id="main-nav" class="flex flex-wrap gap-1"></nav>
        <button data-action="toggle-theme" id="theme-toggle-btn" title="Toggle light/dark theme"
          class="icon-btn border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900">🌙</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6" id="app-root"></main>

  <datalist id="food-datalist"></datalist>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/mealplan.js"></script>
  <script src="js/recommended.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
