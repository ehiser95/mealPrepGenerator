<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Prep Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };
</script>
<style type="text/tailwindcss">
  @layer components {
    .btn-primary {
      @apply bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm;
    }
    .btn-secondary {
      @apply bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition
             dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200;
    }
    .btn-chip {
      @apply bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-xs font-medium px-3 py-1 rounded-full transition
             dark:bg-slate-800 dark:border-slate-600 dark:hover:bg-indigo-950/40 dark:hover:border-indigo-500;
    }
    .icon-btn {
      @apply w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 active:scale-90 transition text-sm
             dark:hover:bg-slate-700;
    }
    .badge {
      @apply inline-block bg-slate-100 text-slate-600 text-[10px] font-medium uppercase tracking-wide px-2 py-0.5 rounded-full mt-1
             dark:bg-slate-700 dark:text-slate-300;
    }
    .macro-tile {
      @apply rounded-lg py-2 transition;
    }
    .field-label {
      @apply flex flex-col gap-1 text-xs font-medium text-slate-500
             dark:text-slate-400;
    }
    .field-input {
      @apply bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 font-normal
             dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100 dark:placeholder-slate-500;
    }
    .empty-state {
      @apply text-center py-16 bg-white rounded-xl border border-dashed border-slate-300
             dark:bg-slate-800 dark:border-slate-600;
    }
    .nav-btn {
      @apply text-sm font-medium px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition
             dark:text-slate-400 dark:hover:text-slate-100 dark:hover:bg-slate-700;
    }
    .nav-btn-active {
      @apply bg-indigo-600 text-white hover:bg-indigo-600 hover:text-white;
    }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-anim { animation: cardIn 0.25s ease-out; }

  @keyframes flashBg {
    0% { background-color: rgb(224 231 255); }
    100% { background-color: transparent; }
  }
  .autofill-flash { animation: flashBg 0.7s ease-out; border-radius: 0.5rem; }

  .scale-panel { animation: cardIn 0.2s ease-out; }

  .toast-enter { opacity: 0; transform: translateX(20px); transition: opacity 0.25s ease, transform 0.25s ease; }
  .toast-enter-active { opacity: 1; transform: translateX(0); }
  .toast-exit { opacity: 0; transform: translateX(20px); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* Fallback theming for form controls that don't carry explicit bg/text
     utility classes (e.g. ingredient/step rows) so nothing stays white-on-
     white in dark mode. Explicit Tailwind classes elsewhere (.field-input,
     etc.) still win since a class selector outranks these element selectors. */
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }
  input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
  select,
  textarea {
    background-color: #fff;
    border-color: #cbd5e1;
    color: #1e293b;
  }
  html.dark input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
  html.dark select,
  html.dark textarea {
    background-color: #0f172a;
    border-color: #475569;
    color: #f1f5f9;
  }

  /* Modal open/close animation for the recipe-plan detail view */
  @keyframes modalBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPanelIn { from { opacity: 0; transform: scale(0.94) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-backdrop { animation: modalBackdropIn 0.2s ease-out; }
  .modal-panel { animation: modalPanelIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors">

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]"></div>

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 transition-colors">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2 whitespace-nowrap">🥗 Meal Prep Generator</h1>
      <div class="flex flex-wrap items-center gap-2">
        <nav id="main-nav" class="flex flex-wrap gap-1"></nav>
        <button data-action="toggle-theme" id="theme-toggle-btn" title="Toggle light/dark theme"
          class="icon-btn border border-slate-200 dark:border-slate-600">🌙</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6" id="app-root"></main>

  <datalist id="food-datalist"></datalist>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/mealplan.js"></script>
  <script src="js/recommended.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
