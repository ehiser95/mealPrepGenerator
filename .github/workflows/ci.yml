name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax
        run: |
          set -e
          for f in js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
